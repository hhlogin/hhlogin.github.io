<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H&H login xidmət kapısı</title>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* LED İşıqlı və Açılış Animasiyalı Sponsor Bölməsi */
        .sponsor-wrapper {
            position: relative;
            padding: 8px 18px;
            border-radius: 30px;
            background: rgba(20, 15, 35, 0.7);
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            animation: slideDownIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* LED İşıq Süzülmə Effekti */
        .sponsor-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(216, 112, 247, 0.6), transparent);
            animation: ledBeam 3s linear infinite;
        }

        @keyframes slideDownIn {
            0% { transform: translateY(-30px); opacity: 0; filter: blur(10px); }
            100% { transform: translateY(0); opacity: 1; filter: blur(0); }
        }

        @keyframes ledBeam {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .sponsor-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #d946ef;
            text-shadow: 0 0 12px rgba(217, 70, 239, 0.8), 0 0 25px rgba(168, 85, 247, 0.6);
            position: relative;
            z-index: 2;
        }

        .sponsor-moon-icon {
            width: 28px;
            height: 28px;
            fill: #c084fc;
            filter: drop-shadow(0 0 10px #d946ef) drop-shadow(0 0 20px #8b5cf6);
            animation: floatMoon 3s ease-in-out infinite;
        }

        @keyframes floatMoon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(-8deg); }
        }

        .login-card {
            background-color: #000000;
            border: 1px solid #ffffff;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            box-sizing: border-box;
            animation: fadeInCard 1.2s ease forwards;
        }

        @keyframes fadeInCard {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }
        .lang-btn {
            background-color: #111827;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .lang-btn:hover, .lang-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .login-card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .verified-badge {
            color: #3b82f6;
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
        }
        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .captcha-box {
            display: flex;
            align-items: center;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            justify-content: space-between;
        }
        .captcha-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .captcha-brand {
            font-size: 10px;
            color: #9ca3af;
            text-align: right;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .divider {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 16px;
        }
        .btn-social {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            border: 1px solid #374151;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-need-help {
            background-color: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
        }
        .btn-need-help:hover {
            background-color: #b91c1c;
            border-color: #b91c1c;
        }
        .hosting-info {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 11px;
            color: #9ca3af;
            flex-wrap: wrap;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .footer-links a {
            color: #9ca3af;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }

        /* YENİLƏNMİŞ MAVİ MAVİ PREMIUM DÜYMƏSİ */
        .btn-premium {
            display: inline-block;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #3b82f6, #0284c7, #06b6d4);
            background-size: 300% 300%;
            animation: gradientAnimBlue 5s ease infinite;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
            cursor: pointer;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        @keyframes gradientAnimBlue {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* AĞ FONLU SADƏ MODAL (AÇILAN PƏNCƏRƏ) STİLLƏRİ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999999;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-white {
            background: #ffffff;
            color: #1f2937;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: left;
            box-sizing: border-box;
        }

        .modal-overlay.active .modal-white {
            transform: scale(1);
        }

        .modal-close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #6b7280;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-close-btn:hover {
            color: #111827;
        }

        .modal-white h3 {
            margin: 0 0 10px 0;
            color: #111827;
            font-size: 18px;
        }

        .modal-payment-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-payment-icons img {
            height: 24px;
            object-fit: contain;
        }

        .modal-form-group {
            margin-bottom: 14px;
        }

        .modal-form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 5px;
        }

        .modal-form-group input,
        .modal-form-group textarea {
            width: 100%;
            padding: 9px 12px;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            color: #111827;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }

        .modal-form-group input:focus,
        .modal-form-group textarea:focus {
            border-color: #2563eb;
            background: #fff;
        }

        .modal-submit-btn {
            width: 100%;
            padding: 11px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .modal-submit-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <!-- LED İşıqlı və Açılış Animasiyalı Sponsor Bölməsi -->
    <div class="sponsor-wrapper">
        <div class="sponsor-badge">

    </div>

    <div class="login-card">
        <!-- Dil Seçimi -->
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="setLanguage('az', this)">AZ</button>
            <button class="lang-btn" onclick="setLanguage('en', this)">EN</button>
            <button class="lang-btn" onclick="setLanguage('ru', this)">RU</button>
        </div>

        <h2 id="txt-title">
            H&H login xidmət kapısı
            <span class="verified-badge" title="Təsdiqlənmiş hesab">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </span>
        </h2>
        
        <form action="https://hhiletisim.github.io" method="GET">
            <div class="input-group">
                <label id="txt-email">E-poçt ünvanı</label>
                <input type="email" placeholder="ad@example.com" required>
            </div>
            
            <div class="input-group">
                <label id="txt-pass">Şifrə</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <div class="captcha-box">

                    <input type="checkbox" required>
                    <span id="txt-robot">Mən robot deyiləm</span>
                </div>

            <button type="submit" class="btn-submit" id="txt-submit">Göndər</button>

        <div class="divider" id="txt-or">və ya sosial hesabla daxil ol</div>

        <!-- Gerçək Google ilə Giriş Düyməsi (SDK) -->
        <div id="g_id_onload"
            data-client_id="952093460553-7vfmmhik4991k29o4coc5fqbshmnvpnl.apps.googleusercontent.com"

        </div>

        <div class="g_id_signin"
            data-type="standard"

            data-theme="outline"
            data-text="sign_in_with"
            data-size="large"
            data-logo_alignment="left"
            data-width="340"

        </div>

        <a href="https://sites.google.com/view/hhdeveloperbot/ev" target="_blank" class="btn-social btn-need-help">
            <span id="txt-needhelp">Need help?</span>
        </a>

        <div class="hosting-info">
            <span id="txt-hosting">Ödəniş dəstəyi:</span> <b>PayPal</b>
        </div>
    </div>

    <!-- Çerezlər və Digər Linklər -->
    <div class="footer-links">
        <a href="#" id="txt-cookies">Çerezlər</a>
        <a href="#" id="txt-brand">H&H login</a>
        <a href="#" id="txt-welcome">Xoş gəldiniz</a>
        <a href="#" id="txt-server">Privacy server</a>
    </div>

    <!-- MAVİ RƏNGLİ PREMIUM DÜYMƏSİ -->
    <button type="button" class="btn-premium" id="txt-premium" onclick="openModal()">
        ⭐ Premium Keyfiyyət
    </button>

    <!-- BEGIN AADS AD UNIT 2454649 -->
    <div id="frame" style="width: 100%; max-width: 400px; margin: 15px auto 0 auto; position: relative; z-index: 99998;">
        <iframe data-aa='2454649' src='//acceptable.a-ads.com/2454649/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
    </div>
    <!-- END AADS AD UNIT 2454649 -->

    <!-- AĞ FONLU YENİ ÖDƏNİŞ / CLIENT ID MODALI -->

        <div class="modal-white">
            <button class="modal-close-btn" onclick="closeModal()">&times;</button>
            <h3>Premium Client ID Sifarişi</h3>
            
            <!-- GOOGLE PAY VƏ PAYPAL SİMGƏLƏRİ -->
            <div class="modal-payment-icons">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Google_Pay_Logo.svg" alt="Google Pay">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal">

            <form action="https://formspree.io/f/xbgdwepa" method="POST">

                    <label>Ad və Soyad</label>
                    <input type="text" name="name" placeholder="Adınızı daxil edin" required>
                </div>
                
                <div class="modal-form-group">
                    <label>E-poçt Ünvanı</label>
                    <input type="email" name="email" placeholder="example@gmail.com" required>
                </div>

                <!-- EKSTRA OLARAQ ƏLAVƏ OLUNAN ADRES XANASI -->
                <div class="modal-form-group">
                    <label>Çatdırılma / Yaşayış Ünvanı (Adres)</label>
                    <input type="text" name="address" placeholder="Şəhər, küçə, mənzil..." required>
                </div>

                <div class="modal-form-group">
                    <label>Qeydlər / Xüsusi İstək</label>
                    <textarea name="message" rows="2" placeholder="Sifarişlə bağlı əlavə qeydiniz..."></textarea>
                </div>

                <button type="submit" class="modal-submit-btn">Ödəniş və Sifarişi Təsdiqlə</button>
            </form>
        </div>
    </div>
