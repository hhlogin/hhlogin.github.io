<div style="background-color: #0b0f19; padding: 30px; border-radius: 12px; max-width: 380px; margin: 30px auto; font-family: Arial, sans-serif; border: 1px solid #1f2937; box-shadow: 0 8px 24px rgba(0,0,0,0.8); color: #ffffff;">

        <div>
            <label style="display: block; color: #9ca3af; font-size: 13px; margin-bottom: 6px;">Şifrə</label>

            <div style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" required style="width: 20px; height: 20px; cursor: pointer;">
                <span style="color: #000; font-size: 13px; font-weight: 500;">Mən robot deyiləm</span>
            </div>
            <div style="text-align: center;">
                <div style="font-size: 10px; color: #555; font-weight: bold;">reCAPTCHA</div>
                <div style="font-size: 8px; color: #555;">Privacy - Terms</div>
            </div>
        </div>

        <!-- Göndər Düyməsi -->
        <button type="submit" style="background-color: #2563eb; color: #ffffff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s;">
            Göndər
        </button>
    </form>

    <!-- Ayırıcı Xətt -->
    <div style="display: flex; align-items: center; margin: 20px 0; color: #4b5563; font-size: 12px;">
        <div style="flex: 1; height: 1px; background: #374151;"></div>
        <span style="padding: 0 10px;">və ya sosial hesab ilə</span>

</div>
