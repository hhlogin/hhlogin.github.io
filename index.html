<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>H&H login xidmət kapısı</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* LED İşıqlı və Açılış Animasiyalı Sponsor Bölməsi */
        .sponsor-wrapper {
            position: relative;
            padding: 8px 18px;
            border-radius: 30px;
            background: rgba(20, 15, 35, 0.7);
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            animation: slideDownIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* LED İşıq Süzülmə Effekti (Mışınlı LED) */
        .sponsor-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(216, 112, 247, 0.6), transparent);
            animation: ledBeam 3s linear infinite;
        }

        @keyframes slideDownIn {
            0% { transform: translateY(-30px); opacity: 0; filter: blur(10px); }
            100% { transform: translateY(0); opacity: 1; filter: blur(0); }
        }

        @keyframes ledBeam {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .sponsor-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #d946ef; /* Şəkildəki tünd çəhrayı/bənövşəyi ton */
            text-shadow: 0 0 12px rgba(217, 70, 239, 0.8), 0 0 25px rgba(168, 85, 247, 0.6);
            position: relative;
            z-index: 2;
        }

        .sponsor-moon-icon {
            width: 28px;
            height: 28px;
            fill: #c084fc;
            filter: drop-shadow(0 0 10px #d946ef) drop-shadow(0 0 20px #8b5cf6);
            animation: floatMoon 3s ease-in-out infinite;
        }

        @keyframes floatMoon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(-8deg); }
        }

        .login-card {
            background-color: #000000;
            border: 1px solid #ffffff;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            box-sizing: border-box;
            animation: fadeInCard 1.2s ease forwards;
        }

        @keyframes fadeInCard {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }
        .lang-btn {
            background-color: #111827;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .lang-btn:hover, .lang-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .login-card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .verified-badge {
            color: #3b82f6;
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
        }
        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .captcha-box {
            display: flex;
            align-items: center;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            justify-content: space-between;
        }
        .captcha-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .captcha-brand {
            font-size: 10px;
            color: #9ca3af;
            text-align: right;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .divider {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 16px;
        }
        .btn-social {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            border: 1px solid #374151;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-google {
            background-color: #ffffff;
            color: #374151;
        }
        .btn-youtube {
            background-color: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
        }
        .btn-social img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
        .hosting-info {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 11px;
            color: #9ca3af;
            flex-wrap: wrap;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .footer-links a {
            color: #9ca3af;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- LED İşıqlı və Açılış Animasiyalı Sponsor Bölməsi -->
    <div class="sponsor-wrapper">
        <div class="sponsor-badge">
            <svg class="sponsor-moon-icon" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#d946ef"/>
                <circle cx="8" cy="8" r="1.2" fill="#ffffff"/>
                <circle cx="15" cy="5.5" r="0.9" fill="#ffffff"/>
                <circle cx="18" cy="11" r="0.7" fill="#ffffff"/>
            </svg>
            <span>Sponsor: play.craftlitus.net</span>
        </div>
    </div>

    <div class="login-card">
        <!-- Dil Seçimi -->
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="setLanguage('az')">AZ</button>
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
        </div>

        <h2 id="txt-title">
            H&H login xidmət kapısı
            <span class="verified-badge" title="Təsdiqlənmiş hesab">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </span>
        </h2>
        
        <form action="https://hhiletisim.github.io" method="GET">
            <div class="input-group">
                <label id="txt-email">E-poçt ünvanı</label>
                <input type="email" placeholder="ad@example.com" required>
            </div>
            
            <div class="input-group">
                <label id="txt-pass">Şifrə</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <div class="captcha-box">
                <div class="captcha-left">
                    <input type="checkbox" required>
                    <span id="txt-robot">Mən robot deyiləm</span>
                </div>
                <div class="captcha-brand">
                    <b>reCAPTCHA</b><br>
                    <span style="font-size: 9px;" id="txt-privacy">Məxfilik - Şərtlər</span>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="txt-submit">Göndər</button>
        </form>

        <div class="divider" id="txt-or">və ya sosial hesabla daxil ol</div>

        <a href="https://hhiletisim.github.io" class="btn-social btn-google">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
            <span id="txt-google">Google ilə daxil ol</span>
        </a>

        <a href="https://hhiletisim.github.io" class="btn-social btn-youtube">
            <img src="https://www.svgrepo.com/show/475702/youtube-color.svg" alt="YouTube">
            <span id="txt-youtube">YouTube ilə daxil ol</span>
        </a>

        <div class="hosting-info">
            <span id="txt-hosting">Ödəniş dəstəyi:</span> <b>PayPal</b>
        </div>
    </div>

    <!-- Çerezlər və Digər Linklər -->
    <div class="footer-links">
        <a href="#" id="txt-cookies">Çerezlər</a>
        <a href="#" id="txt-brand">H&H login</a>
        <a href="#" id="txt-welcome">Xoş gəldiniz</a>
        <a href="#" id="txt-server">Privacy server</a>
    </div>

    <!-- BEGIN AADS AD UNIT 2454649 -->
    <div id="frame" style="width: 100%; max-width: 400px; margin: 15px auto 0 auto; position: relative; z-index: 99998;">
        <iframe data-aa='2454649' src='//acceptable.a-ads.com/2454649/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
    </div>
    <!-- END AADS AD UNIT 2454649 -->

    <script>
        const translations = {
            az: {
                title: "H&H login xidmət kapısı",
                email: "E-poçt ünvanı",
                pass: "Şifrə",
                robot: "Mən robot deyiləm",
                privacy: "Məxfilik - Şərtlər",
                submit: "Göndər",
                or: "və ya sosial hesabla daxil ol",
                google: "Google ilə daxil ol",
                youtube: "YouTube ilə daxil ol",
                hosting: "Ödəniş dəstəyi:",
                cookies: "Çerezlər",
                brand: "H&H login",
                welcome: "Xoş gəldiniz",
                server: "Privacy server"
            },
            en: {
                title: "H&H Login Portal",
                email: "Email address",
                pass: "Password",
                robot: "I'm not a robot",
                privacy: "Privacy - Terms",
                submit: "Submit",
                or: "or sign in with social account",
                google: "Sign in with Google",
                youtube: "Sign in with YouTube",
                hosting: "Payment support:",
                cookies: "Cookies",
                brand: "H&H login",
                welcome: "Welcome",
                server: "Privacy server"
            },
            ru: {
                title: "Портал входа H&H",
                email: "Электронная почта",
                pass: "Пароль",
                robot: "Я не робот",
                privacy: "Конфиденциальность - Условия",
                submit: "Отправить",
                or: "или войти через соцсети",
                google: "Войти через Google",
                youtube: "Войти через YouTube",
                hosting: "Поддержка оплаты:",
                cookies: "Куки",
                brand: "H&H login",
                welcome: "Добро пожаловать",
                server: "Privacy server"
            }
        };

        function setLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('txt-title').childNodes[0].nodeValue = translations[lang].title + " ";
            document.getElementById('txt-email').innerText = translations[lang].email;
            document.getElementById('txt-pass').innerText = translations[lang].pass;
            document.getElementById('txt-robot').innerText = translations[lang].robot;
            document.getElementById('txt-privacy').innerText = translations[lang].privacy;
            document.getElementById('txt-submit').innerText = translations[lang].submit;
            document.getElementById('txt-or').innerText = translations[lang].or;
            document.getElementById('txt-google').innerText = translations[lang].google;
            document.getElementById('txt-youtube').innerText = translations[lang].youtube;
            document.getElementById('txt-hosting').innerText = translations[lang].hosting;
            document.getElementById('txt-cookies').innerText = translations[lang].cookies;
            document.getElementById('txt-brand').innerText = translations[lang].brand;
            document.getElementById('txt-welcome').innerText = translations[lang].welcome;
            document.getElementById('txt-server').innerText = translations[lang].server;
        }
    </script>
</body>
</html>
